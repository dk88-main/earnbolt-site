<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnBolt - Loading...</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .loader-container {
            text-align: center;
            color: white;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-text {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <div class="status-text" id="status">Initializing...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
    </div>

    <script>
        // Plugin file mapping
        const PLUGIN_FILES = {
            // Animal Plugins
            'bee_plugin': { name: 'Bee_PLUGIN', path: 'animals/Bee_PLUGIN' },
            'godzilla_plugin': { name: 'GodZilla_PLUGIN', path: 'animals/GodZilla_PLUGIN' },
            'deer_plugin': { name: 'Deer_PLUGIN', path: 'animals/Deer_PLUGIN' },
            'hipo_plugin': { name: 'Hipo_PLUGIN', path: 'animals/Hipo_PLUGIN' },
            'peacock_plugin': { name: 'PeaCock_PLUGIN', path: 'animals/PeaCock_PLUGIN' },
            'wildbeast_plugin': { name: 'Wildbeast_PLUGIN', path: 'animals/Wildbeast_PLUGIN' },
            'camel_plugin': { name: 'Camel_PLUGIN', path: 'animals/Camel_PLUGIN' },
            'crocodile_plugin': { name: 'Crocodile_PLUGIN', path: 'animals/Crocodile_PLUGIN' },
            'eagle_plugin': { name: 'Eagle_Animal_PLUGIN', path: 'animals/Eagle_Animal_PLUGIN' },
            'gorilla_plugin': { name: 'Gorilla_PLUGIN', path: 'animals/Gorilla_PLUGIN' },
            'lion_plugin': { name: 'Lion_PLUGIN', path: 'animals/Lion_PLUGIN' },
            'zebra_plugin': { name: 'Zebra_PLUGIN', path: 'animals/Zebra_PLUGIN' },
            
            // Vehicle Plugins
            'invisible_car': { name: 'InvisibleCar_PLUGIN', path: 'vehicles/InvisibleCar_PLUGIN' },
            'kgf_bike': { name: 'KGF_Bike_PLUGIN', path: 'vehicles/KGF_Bike_PLUGIN' },
            'farm_tractor': { name: 'Farm_Tractor_PLUGIN', path: 'vehicles/Farm_Tractor_PLUGIN' },
            'range_rover': { name: 'RangeRover_PLUGIN', path: 'vehicles/RangeRover_PLUGIN' },
            'swift_2024': { name: 'Swift_2024_PLUGIN', path: 'vehicles/Swift_2024_PLUGIN' },
            'omni_van': { name: 'Omni_Van_PLUGIN', path: 'vehicles/Omni_Van_PLUGIN' },
            'pig_car': { name: 'PigCar_PLUGIN', path: 'vehicles/PigCar_PLUGIN' },
            'terzo_lambo': { name: 'Terzo_Lambo_PLUGIN', path: 'vehicles/Terzo_Lambo_PLUGIN' },
            
            // Mission Plugins
            'mission1_mod': { name: 'Mission1_MOD.json', path: 'missions/Mission1_MOD.json' },
            'mission2_mod': { name: 'Mission2_MOD.json', path: 'missions/Mission2_MOD.json' },
            'mission3_mod': { name: 'Mission3_MOD.json', path: 'missions/Mission3_MOD.json' },
            'mission4_mod': { name: 'Mission4_MOD.json', path: 'missions/Mission4_MOD.json' },
            'mission5_mod': { name: 'Mission5_MOD.json', path: 'missions/Mission5_MOD.json' },
            
            // City Plugins
            'egypt_city': { name: 'E&PS by Aysheq.json', path: 'cities/E&PS by Aysheq.json' },
            'village_map': { name: 'villagemap', path: 'cities/villagemap' },
            'zoo_map': { name: 'Zoo By Topical Gamer.json', path: 'cities/Zoo By Topical Gamer.json' },
            'doraemon_house': { name: 'doreamon house by cim list .json', path: 'cities/doreamon house by cim list .json' },
            
            // Player Plugins
            'beast_player': { name: 'Beast_PLUGIN', path: 'players/Beast_PLUGIN' },
            'carry_player': { name: 'Carry_PLUGIN', path: 'players/Carry_PLUGIN' },
            'giraf_cartoon': { name: 'GirafCartoon_PLUGIN', path: 'players/GirafCartoon_PLUGIN' },
            'monkey_player': { name: 'Monkey__PLUGIN', path: 'players/Monkey__PLUGIN' },
            'skeleton_player': { name: 'Skeleton_PLUGIN', path: 'players/Skeleton_PLUGIN' },
            'pgs_player': { name: 'PGS_PLUGIN', path: 'players/PGS_PLUGIN' },
            
            // RGS Load Files
            'buggy_car': { name: 'Buggy.glb', path: 'rgs/Buggy.glb' },
            'bujji_car': { name: 'bujji.glb', path: 'rgs/bujji.glb' },
            'doremon_char': { name: 'doremon.glb', path: 'rgs/doremon.glb' },
            'franklin_char': { name: 'franklin.glb', path: 'rgs/franklin.glb' },
            'shinchan_char': { name: 'shinchan.glb', path: 'rgs/shinchan.glb' },
            'dragon_head': { name: 'Dragon_Head.glb', path: 'rgs/Dragon_Head.glb' },
            'girl_char': { name: 'girl.glb', path: 'rgs/girl.glb' },
            'hover_bike': { name: 'HoverBike.glb', path: 'rgs/HoverBike.glb' },
            'mcqueen_car': { name: 'mcqueencar.glb', path: 'rgs/mcqueencar.glb' },
            'trevor_char': { name: 'trevor.glb', path: 'rgs/trevor.glb' },
            
            // Challenge Plugins
            'horror_ghost': { name: 'HorrorGhost_PLUGIN', path: 'challenges/HorrorGhost_PLUGIN' },
            'zombie_challenge': { name: 'ZombieMode6_PLUGIN', path: 'challenges/ZombieMode6_PLUGIN' },
            'city_v2': { name: 'CityV2_PLUGIN', path: 'challenges/CityV2_PLUGIN' },
            'race_track': { name: 'RaceTrack_PLUGIN', path: 'challenges/RaceTrack_PLUGIN' },
            
            // RGS MOD Plugins
            'build_destroy': { name: 'Build_Destroy_MOD.json', path: 'rgsmods/Build_Destroy_MOD.json' },
            'funntyaa_mod': { name: 'Funntyaa_MOD.json', path: 'rgsmods/Funntyaa_MOD.json' },
            'gaming_boy': { name: 'gaming_boy_3609_MOD.json', path: 'rgsmods/gaming_boy_3609_MOD.json' },
            'jay_plays': { name: 'Jay_Plays_MOD.json', path: 'rgsmods/Jay_Plays_MOD.json' },
            'mega_ramp': { name: 'RGS_MegaRamp_MOD.json', path: 'rgsmods/RGS_MegaRamp_MOD.json' },
            
            // IPL Texture Plugins
            'csk_texture': { name: 'CSK_Texture.jpg', path: 'textures/csk.jpg' },
            'mi_texture': { name: 'MI_Texture.jpg', path: 'textures/mi.jpg' },
            'rcb_texture': { name: 'RCB_Texture.jpg', path: 'textures/rcb.jpg' },
            'kkr_texture': { name: 'KKR_Texture.jpg', path: 'textures/kkr.jpg' }
        };
        
        const API_BASE = 'api/download-handler.php';
        
        // Get file info
        function getFileInfo(fileKey) {
            const file = PLUGIN_FILES[fileKey];
            if (!file) return null;
            return {
                name: file.name,
                path: file.path,
                exists: true
            };
        }

        // Get file parameter from URL
        function getFileParam() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('file');
        }

        // Update status and progress
        function updateStatus(text, progress = 0) {
            document.getElementById('status').textContent = text;
            document.getElementById('progress').style.width = progress + '%';
        }

        // Download file with progress
        function downloadFile(fileKey) {
            const fileInfo = getFileInfo(fileKey);
            if (!fileInfo) {
                updateStatus('File not found!', 0);
                return;
            }

            updateStatus(`Preparing ${fileInfo.name}...`, 20);
            
            setTimeout(() => {
                updateStatus(`Downloading ${fileInfo.name}...`, 50);
                
                // Start actual download
                const downloadUrl = `${API_BASE}?file=${fileKey}`;
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = fileInfo.name;
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => {
                    updateStatus('Download started!', 100);
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                }, 1000);
            }, 1500);
        }

        // Initialize download process
        window.onload = function() {
            const fileKey = getFileParam();
            
            if (!fileKey) {
                updateStatus('No file specified!', 0);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                return;
            }

            updateStatus('Initializing download...', 5);
            
            setTimeout(() => {
                updateStatus('Connecting to server...', 15);
                setTimeout(() => {
                    downloadFile(fileKey);
                }, 1000);
            }, 1000);
        };
    </script>
</body>
</html>
