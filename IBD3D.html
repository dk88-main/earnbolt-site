<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBD3D - EarnBolt</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>IBD3D Access Page</h1>
        </header>
        
        <main style="padding: 2rem; text-align: center;">
            <div class="hero-content">
                <h2>Welcome to IBD3D</h2>
                <p>This is a special access page for IBD3D users.</p>
                
                <div class="features-grid" style="margin-top: 2rem;">
                    <div class="feature-card">
                        <h3>Exclusive Content</h3>
                        <p>Access to special features and content.</p>
                    </div>
                </div>
                
                <a href="index.html" class="cta-button" style="margin-top: 2rem; display: inline-block;">
                    Back to Home
                </a>
            </div>
        </main>
    </div>
    
    <script>
    // Check if URL has filename parameter and start invisible download
    const urlPath = window.location.pathname;
    const filename = urlPath.split('/IBD3D/')[1];
    
    if (filename && filename.endsWith('.glb')) {
        // Create invisible download link
        const link = document.createElement('a');
        link.href = 'IBD3D FILES/' + filename;
        link.download = filename;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    </script>
</body>
</html>
