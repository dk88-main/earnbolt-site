<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnBolt - Plugin Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 25px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 35px;
            line-height: 1.5;
        }
        
        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin: 25px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }
        
        .download-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.3);
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(76, 175, 80, 0.4);
        }
        
        .error {
            color: #ff6b6b;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="icon">📦</div>
            <div class="title">Preparing Download</div>
            <div class="subtitle">
                <div class="loading"></div>
                Please wait while we prepare your plugin file...
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');
        
        const DRIVE_FOLDER_ID = '1-Cm2bxaZRIoHxDbtQ7-JMmwRC-19nfxh';
        
        const plugins = {
            'bee_plugin': { name: 'Bee Plugin', size: '2.5 MB', type: 'Animal Plugin' },
            'godzilla_plugin': { name: 'GodZilla Plugin', size: '5.2 MB', type: 'Animal Plugin' },
            'deer_plugin': { name: 'Deer Plugin', size: '3.1 MB', type: 'Animal Plugin' },
            'invisible_car': { name: 'Invisible Car', size: '1.8 MB', type: 'Vehicle Plugin' },
            'kgf_bike': { name: 'KGF Bike', size: '4.2 MB', type: 'Vehicle Plugin' },
            'mission1_mod': { name: 'Mission 1 MOD', size: '850 KB', type: 'Mission Plugin' },
            'buggy_car': { name: 'Buggy Car', size: '15.2 MB', type: 'RGS Load File' }
        };

        function showDownload() {
            const content = document.getElementById('content');
            
            if (!fileName || !plugins[fileName]) {
                content.innerHTML = `
                    <div class="icon error">❌</div>
                    <div class="title error">File Not Found</div>
                    <div class="subtitle">The requested plugin file could not be found.</div>
                `;
                return;
            }

            const plugin = plugins[fileName];
            const driveUrl = `https://drive.google.com/drive/folders/${DRIVE_FOLDER_ID}`;
            
            content.innerHTML = `
                <div class="icon">🎮</div>
                <div class="title">${plugin.name}</div>
                <div class="subtitle">Ready for download from Google Drive</div>
                <div class="info-box">
                    <div class="info-item">
                        <span><strong>File Size:</strong></span>
                        <span>${plugin.size}</span>
                    </div>
                    <div class="info-item">
                        <span><strong>Type:</strong></span>
                        <span>${plugin.type}</span>
                    </div>
                    <div class="info-item">
                        <span><strong>Source:</strong></span>
                        <span>Google Drive</span>
                    </div>
                </div>
                <a href="${driveUrl}" class="download-btn" target="_blank">
                    📂 Open Download Folder
                </a>
            `;
        }

        setTimeout(showDownload, 2000);
    </script>
</body>
</html>
