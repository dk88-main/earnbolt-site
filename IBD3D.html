<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EarnBolt - Plugin Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 25px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 35px;
            line-height: 1.5;
        }
        
        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin: 25px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }
        
        .download-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.3);
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(76, 175, 80, 0.4);
        }
        
        .error {
            color: #ff6b6b;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="icon">📦</div>
            <div class="title">Preparing Download</div>
            <div class="subtitle">
                <div class="loading"></div>
                Please wait while we prepare your plugin file...
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');
        
        const plugins = {
            'bee_plugin': { name: 'Bee Plugin', size: '2.5 MB', type: 'Animal Plugin', fileId: '1lf09HwSkOX_uGdYOKLyogUqUZc3Qmcss' },
            'camel_plugin': { name: 'Camel Plugin', size: '3.2 MB', type: 'Animal Plugin', fileId: '1e0pZHYh-dkCDZWVhVDOtLYB-gGsVworu' },
            'crocodile_plugin': { name: 'Crocodile Plugin', size: '4.5 MB', type: 'Animal Plugin', fileId: '1U5TcrkTxpVPomDxyREhXZKTxsXhQYMAA' },
            'deer_plugin': { name: 'Deer Plugin', size: '3.1 MB', type: 'Animal Plugin', fileId: '17YqBNswLdNkmOdor26oCd36iypqd2ZeD' },
            'eagle_plugin': { name: 'Eagle Animal Plugin', size: '3.7 MB', type: 'Animal Plugin', fileId: '1DzrlVRRU--ItT2uAn9uUJEZQtHXLe0IC' },
            'godzilla_plugin': { name: 'GodZilla Plugin', size: '5.2 MB', type: 'Animal Plugin', fileId: '1k1ZMxdFs8x8UOokiePCaFU9fTNxsy2rQ' },
            'gorilla_plugin': { name: 'Gorilla Plugin', size: '4.8 MB', type: 'Animal Plugin', fileId: '1N4T2vhlKxb8DUr4jkYQz9gCdVn2h3XFp' },
            'hipo_plugin': { name: 'Hipo Plugin', size: '4.3 MB', type: 'Animal Plugin', fileId: '16BfndQJRVCbBFgYHBK1JYThWo_gUYKcW' },
            'jiraffe_plugin': { name: 'Jiraffe Plugin', size: '4.0 MB', type: 'Animal Plugin', fileId: '1q6JMADSNIr8D95Tk0N_sZcm5oPmL9H55' },
            'lion_plugin': { name: 'Lion Plugin', size: '5.1 MB', type: 'Animal Plugin', fileId: '1wNAQD8jEU7_G9agN6JwnslaY965ucESv' },
            'lionf_plugin': { name: 'Lion Female Plugin', size: '4.9 MB', type: 'Animal Plugin', fileId: '1DsuLvctvkoiHRVLpCfVv08L1W3nL1qxe' },
            'monster_big_plugin': { name: 'Monster Big Plugin', size: '6.2 MB', type: 'Animal Plugin', fileId: '1DsuLvctvkoiHRVLpCfVv08L1W3nL1qxe' },
            'peacock_plugin': { name: 'Peacock Plugin', size: '3.8 MB', type: 'Animal Plugin', fileId: '1QWOQ8VGN__44b2f6dNahZg7dPexhB_OI' },
            'raino_plugin': { name: 'Raino Plugin', size: '4.4 MB', type: 'Animal Plugin', fileId: '11gSSLpugLymamtA7RTlpDOf0dUOyhHPq' },
            'snake_monster_plugin': { name: 'Snake Monster Plugin', size: '5.5 MB', type: 'Animal Plugin', fileId: '1AvXIATWwG6_cnDqGLrEMP6AHlmnnhRof' },
            'wildbeast_plugin': { name: 'Wildbeast Plugin', size: '4.1 MB', type: 'Animal Plugin', fileId: '1iojH8R0vuXocPnGGSc3lkv7_nG_j9f68' },
            'zebra_plugin': { name: 'Zebra Plugin', size: '3.9 MB', type: 'Animal Plugin', fileId: '1cvJqIF0qH5R39tbd7xqrO7oYGhvNhMDm' }
        };

        function showDownload() {
            const content = document.getElementById('content');
            
            if (!fileName || !plugins[fileName]) {
                content.innerHTML = `
                    <div class="icon error">❌</div>
                    <div class="title error">File Not Found</div>
                    <div class="subtitle">The requested plugin file could not be found.</div>
                `;
                return;
            }

            const plugin = plugins[fileName];
            const driveUrl = `https://drive.google.com/uc?export=download&id=${plugin.fileId}`;
            
            content.innerHTML = `
                <div class="icon">🎮</div>
                <div class="title">${plugin.name}</div>
                <div class="subtitle">Ready for download from Google Drive</div>
                <div class="info-box">
                    <div class="info-item">
                        <span><strong>File Size:</strong></span>
                        <span>${plugin.size}</span>
                    </div>
                    <div class="info-item">
                        <span><strong>Type:</strong></span>
                        <span>${plugin.type}</span>
                    </div>
                    <div class="info-item">
                        <span><strong>Source:</strong></span>
                        <span>Google Drive</span>
                    </div>
                </div>
                <a href="${driveUrl}" class="download-btn" target="_blank">
                    📥 Download Now
                </a>
            `;
        }

        setTimeout(showDownload, 2000);
    </script>
</body>
</html>
